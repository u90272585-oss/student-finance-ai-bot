<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Finance Bot — База данных</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { color: #2c3e50; }
        h2 { color: #34495e; margin-top: 30px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .premium-yes { color: green; font-weight: bold; }
        .premium-no { color: gray; }
        .stats { background-color: #e8f4f8; padding: 15px; border-radius: 5px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>📊 Finance Bot — База данных</h1>
    <p>Обновлено: 01.05.2026 20:54</p>
    
    <div class="stats">
        <b>📈 Статистика:</b><br>
        👥 Всего пользователей: 0<br>
        💎 Активный премиум: 0<br>
    </div>
    
    <h2>👥 Пользователи</h2>
    <table>
        <tr>
            <th>ID</th>
            <th>Имя</th>
            <th>Язык</th>
            <th>Валюта</th>
            <th>Дата регистрации</th>
            <th>Премиум</th>
            <th>Премиум до</th>
        </tr>
    </table>
</body>
</html>
