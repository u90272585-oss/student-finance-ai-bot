name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Проверка стиля кода (твой оригинальный шаг)
  lint:
    name: Lint with flake8
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install flake8
          pip install -r requirements.txt

      - name: Run flake8
        run: |
          flake8 . --count --max-line-length=88 --exclude=.git,__pycache__,venv,.venv --statistics

  # 2. НОВЫЙ ШАГ: Автоматический запуск наших 37 тестов
  test:
    name: Run Pytest Controls
    runs-on: ubuntu-latest
    needs: lint # Запускается только после успешного линтера

    # Поднимаем временный чистый Postgres в облаке GitHub для асинхронных тестов базы
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Используем кэш, чтобы тесты на GitHub запускались мгновенно
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio asyncpg

      - name: Run Pytest
        env:
          # Передаем ссылку на временную БД, чтобы asyncpg инициализировал структуру
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
        run: |
          pytest -v

  # 3. Деплой на Render (твой оригинальный шаг, но теперь ждет завершения тестов)
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: test # Ждем, пока пройдут ТЕСТЫ (а тесты ждут линтер)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render Deploy
        run: |
          curl -s -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
