services:
  - type: web
    name: finance-bot
    runtime: python
    repo: https://github.com/u90272585-oss/student-finance-ai-bot
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: finance-db
          property: connectionString
      - key: CEREBRAS_API_KEY
        sync: false
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py

databases:
  - name: finance-db
    plan: free
    